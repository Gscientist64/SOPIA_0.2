# render.yaml — SOPiA MVP on Render Free Tier
# Deploy: connect this repo to Render → it auto-reads this file (Blueprint)
# Or create a Web Service manually and copy these settings.

services:
  - type: web
    name: sopia-mvp
    runtime: python
    plan: free                # Free tier: 750 hrs/month = 24/7 uptime
    buildCommand: pip install -r requirements-render.txt
    startCommand: gunicorn --workers 1 --timeout 120 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: FLASK_ENV
        value: production
      - key: DEBUG
        value: "False"
      - key: GOOGLE_API_KEY
        sync: false            # set in Render dashboard
      - key: OPENAI_API_KEY
        sync: false            # optional fallback — leave empty if unused
      - key: TWILIO_ACCOUNT_SID
        sync: false            # optional (for future WhatsApp)
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_NUMBER
        sync: false
      - key: SECRET_KEY
        generateValue: true    # auto-generated random secret


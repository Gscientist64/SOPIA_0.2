<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOPiA - Medical AI Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff6b9d 0%, #c44569 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            height: 90vh;
            max-height: 800px;
        }

        .header {
            background: linear-gradient(135deg, #ff6b9d 0%, #c44569 100%);
            color: white;
            padding: 20px;
            border-radius: 20px 20px 0 0;
            text-align: center;
            border-bottom: 3px solid #c44569;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .header p {
            font-size: 13px;
            opacity: 0.9;
        }

        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.bot {
            justify-content: flex-start;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 15px;
            border-radius: 12px;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .user .message-content {
            background: #ff6b9d;
            color: white;
            border-bottom-right-radius: 2px;
        }

        .bot .message-content {
            background: white;
            color: #333;
            border: 1px solid #e0e0e0;
            border-bottom-left-radius: 2px;
        }

        .confidence {
            font-size: 12px;
            margin-top: 5px;
            opacity: 0.7;
            font-style: italic;
        }

        .loading {
            display: flex;
            gap: 5px;
            align-items: center;
            padding: 12px 15px;
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
        }

        .loading-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ff6b9d;
            animation: bounce 1.4s infinite;
        }

        .loading-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .loading-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {
            0%, 80%, 100% {
                transform: scale(1);
                opacity: 0.5;
            }
            40% {
                transform: scale(1.2);
                opacity: 1;
            }
        }

        .sources {
            font-size: 11px;
            color: #999;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid #e0e0e0;
        }

        .input-area {
            padding: 20px;
            background: white;
            border-top: 1px solid #e0e0e0;
            border-radius: 0 0 20px 20px;
            display: flex;
            gap: 10px;
        }

        .input-wrapper {
            flex: 1;
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 14px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #ff6b9d;
        }

        button {
            padding: 12px 25px;
            background: linear-gradient(135deg, #ff6b9d 0%, #c44569 100%);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 107, 157, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .suggested-questions {
            padding: 20px;
            background: #fff0f5;
            border-top: 1px solid #e0e0e0;
            border-bottom: 1px solid #e0e0e0;
        }

        .suggested-questions p {
            font-size: 12px;
            color: #c44569;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .question-chips {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .chip {
            padding: 8px 12px;
            background: white;
            border: 1px solid #ff6b9d;
            border-radius: 20px;
            font-size: 13px;
            color: #ff6b9d;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .chip:hover {
            background: #ff6b9d;
            color: white;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #999;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 10px 15px;
            border-radius: 8px;
            margin: 10px 0;
            font-size: 13px;
        }

        .success-badge {
            display: inline-block;
            background: #4caf50;
            color: white;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            margin-left: 8px;
        }

        @media (max-width: 768px) {
            .message-content {
                max-width: 90%;
            }

            .header h1 {
                font-size: 20px;
            }

            .question-chips {
                flex-direction: column;
            }

            .chip {
                width: 100%;
                text-align: center;
            }
        }

        .medical-icon {
            display: inline-block;
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>
                <span class="medical-icon">🏥</span>
                SOPiA
            </h1>
            <p>AI-Powered HIV Care Protocol Assistant</p>
        </div>

        <div class="suggested-questions" id="suggestedQuestionsArea">
            <p>💡 Try asking:</p>
            <div class="question-chips">
                <div class="chip" onclick="askQuestion('What is Advanced HIV Disease (AHD)?')">What is AHD?</div>
                <div class="chip" onclick="askQuestion('What are CD4 count criteria?')">CD4 Criteria</div>
                <div class="chip" onclick="askQuestion('What is the first-line ART regimen?')">ART Regimens</div>
                <div class="chip" onclick="askQuestion('How to screen for TB in HIV patients?')">TB Screening</div>
            </div>
        </div>

        <div class="chat-area" id="chatArea">
            <div class="empty-state">
                <div class="empty-state-icon">👋</div>
                <p>Welcome to SOPiA! Ask any question about HIV care protocols.</p>
            </div>
        </div>

        <div class="input-area">
            <div class="input-wrapper">
                <input 
                    type="text" 
                    id="questionInput" 
                    placeholder="Type your medical question..." 
                    onkeypress="handleKeyPress(event)"
                >
                <button onclick="sendQuestion()" id="sendBtn">Send</button>
            </div>
        </div>
    </div>

    <script>
        let isLoading = false;

        async function sendQuestion() {
            const input = document.getElementById('questionInput');
            const question = input.value.trim();

            if (!question || isLoading) return;

            // Clear empty state
            const emptyState = document.querySelector('.empty-state');
            if (emptyState) {
                emptyState.remove();
            }

            // Hide suggested questions
            document.getElementById('suggestedQuestionsArea').style.display = 'none';

            // Add user message
            addMessage(question, 'user');
            input.value = '';
            input.focus();

            isLoading = true;
            document.getElementById('sendBtn').disabled = true;

            // Show loading
            showLoading();

            try {
                // Send to backend
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ question: question })
                });

                if (!response.ok) {
                    throw new Error(`Server error: ${response.status}`);
                }

                const data = await response.json();

                // Remove loading
                removeLoading();

                // Add bot response
                const answer = data.answer || 'No response received';
                const confidence = data.confidence || 0;
                const sources = data.sources_used || [];

                addMessage(answer, 'bot', confidence, sources);

            } catch (error) {
                removeLoading();
                addMessage(
                    `❌ Error: ${error.message}. Please check if the server is running at http://localhost:5050`,
                    'bot',
                    0,
                    []
                );
                console.error('Error:', error);
            }

            isLoading = false;
            document.getElementById('sendBtn').disabled = false;
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter' && !isLoading) {
                sendQuestion();
            }
        }

        function askQuestion(question) {
            document.getElementById('questionInput').value = question;
            sendQuestion();
        }

        function addMessage(text, sender, confidence = null, sources = []) {
            const chatArea = document.getElementById('chatArea');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;

            let content = `<div class="message-content">
                ${text.replace(/\n/g, '<br>')}
            `;

            if (sender === 'bot') {
                if (confidence !== null && confidence < 0.7) {
                    content += `<div class="confidence">⚠️ Confidence: ${(confidence * 100).toFixed(0)}%</div>`;
                }
                if (sources && sources.length > 0) {
                    content += `<div class="sources">📚 Sources: ${sources.join(', ')}</div>`;
                }
            }

            content += '</div>';
            messageDiv.innerHTML = content;
            chatArea.appendChild(messageDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function showLoading() {
            const chatArea = document.getElementById('chatArea');
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message bot';
            loadingDiv.id = 'loading-message';
            loadingDiv.innerHTML = `
                <div class="loading">
                    <div class="loading-dot"></div>
                    <div class="loading-dot"></div>
                    <div class="loading-dot"></div>
                </div>
            `;
            chatArea.appendChild(loadingDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function removeLoading() {
            const loading = document.getElementById('loading-message');
            if (loading) {
                loading.remove();
            }
        }

        // Focus input on load
        window.addEventListener('load', () => {
            document.getElementById('questionInput').focus();
        });
    </script>
</body>
</html>
